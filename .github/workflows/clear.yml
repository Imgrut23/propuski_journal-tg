name: clear
on: workflow_dispatch
permissions:
  contents: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git ls-files | grep -vE '^(\.github/|CNAME$)' | xargs -d '\n' git rm -q
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git commit -m clear
          git push
